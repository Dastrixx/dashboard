services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: dashboard_local_only
      POSTGRES_DB: dashboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dashboard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dashboard_pg_data:
